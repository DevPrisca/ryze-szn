services:
  - type: web
    name: ryze-szn-frontend
    runtime: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://ryze-szn.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
